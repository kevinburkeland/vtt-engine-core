name: Scheduled Dependency Check

on:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-dependencies:
    name: 📦 Check Dependency Currency & Security
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🎯 Set up Dart SDK (3.14.0)
        uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: '3.14.0'

      - name: 📦 Install Dependencies
        run: dart pub get

      - name: 🔍 Resolve Outdated Dependencies
        run: dart pub outdated --json --show-all > /tmp/pub_outdated.json

      - name: 🔒 Check Dependency Currency & Security
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -I scripts/check_dependencies.py --pub-outdated /tmp/pub_outdated.json --pubspec pubspec.yaml --workflows .github/workflows --exceptions dependency_exceptions.tsv
