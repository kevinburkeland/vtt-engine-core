name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 🧪 Test Suite (Dart 3.13.5)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 🎯 Set up Dart SDK (3.13.5)
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: '3.13.5'

      - name: 📦 Install Dependencies
        run: dart pub get

      - name: 🔍 Static Analysis (Fatal Infos)
        run: dart analyze --fatal-infos

      - name: 🧪 Execute Unit Tests
        run: dart test

  web:
    name: 🌐 Web Compiler Suite (dart2js on Node)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 🎯 Set up Dart SDK (3.13.5)
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: '3.13.5'

      - name: 📦 Install Dependencies
        run: dart pub get

      - name: 🌐 Execute Web Compiler Tests (Node)
        run: dart test -p node

  min-sdk:
    name: 🎯 Minimum SDK Verification (Dart 3.3.4)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 🎯 Set up Dart SDK (3.3.4)
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: '3.3.4'

      - name: 📦 Install Dependencies
        run: dart pub get

      - name: 🧪 Execute Unit Tests
        run: dart test

  dco:
    name: 📜 DCO Sign-off & Workflow Pin Verification
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository (Full History)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: 🧪 Run Action Pinning Script Self-Tests
        run: ./scripts/test_check_action_pins.sh

      - name: 🔒 Verify Action Pinning
        run: ./scripts/check_action_pins.sh

      - name: 🧪 Run DCO Script Self-Tests
        run: ./scripts/test_check_dco.sh

      - name: 📜 Verify Commit Sign-offs
        # Baseline 7a7c1d5b057d3a4b1ba8994d2cf35108e923a270 is the newest unsigned commit in repository history.
        run: ./scripts/check_dco.sh 7a7c1d5b057d3a4b1ba8994d2cf35108e923a270 HEAD

      - name: 🧪 Run Mutation Branch Script Self-Tests
        run: ./scripts/test_check_mutation_branches.sh

      - name: 🧪 Run Retire Mutation Branches Script Self-Tests
        run: ./scripts/test_retire_mutation_branches.sh

      - name: 🔒 Check Mutation Branches Limit
        run: ./scripts/check_mutation_branches.sh 20
